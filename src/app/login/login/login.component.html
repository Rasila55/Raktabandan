<link rel="stylesheet" href="login.component.css">

<div class="auth-container">
  <div class="auth-form">
    <h2>SIGN UP</h2>

    <label>Mobile No.</label>

    <button class="login-btn">LOGIN</button>

  <div class="auth-branding">
    <img src="assets/logo.png" alt="Logo" />
  </div>
</div>
